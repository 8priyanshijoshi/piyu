<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cards{
            color: white;
            align-items: center;
            margin: 10px;
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr;
        }
        .card1{
            background-color: burlywood;
            padding: 40px;
        }
        .card2{
            background-color: blue;
            padding: 40px;
        }
        .card3{
            background-color: cadetblue;
            padding: 40px;
        }
        .card4{
            background-color: blueviolet;padding: 40px;
        }
        .card5{
            background-color: darkcyan;padding: 40px;
        }
        .card6{
            background-color: cadetblue;padding: 40px;
        }
        @media (min-width:768px) {
            .cards{
                grid-template-columns: repeat(3,1fr);
            }
        }
    </style>
</head>
<body>
    <div class="cards">
        <div class="card1">card1</div>
        <div class="card2">card2</div>
        <div class="card3">card3</div>
        <div class="card4">card4</div>
        <div class="card5">card5</div>
        <div class="card6">card6</div>
    </div>
</body>
</html>
