<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">

    <!--font-awesome link-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    
    <header>
        <h1>My Online Store</h1>
        <div class="shopping"><i class="fa-solid fa-cart-shopping" onclick="toggleCart()"></i><span id="count">0</span>
        </div>
    </header>

    <main>
        <div class="product-list">
            <div class="product" data-id="1" data-name="Product 1" data-price="19.99">
                <img src="images/1.jpeg" alt="Product 1">
                <h3>Product 1</h3>
                <p>$19.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <div class="product" data-id="2" data-name="Product 2" data-price="29.99">
                <img src="images/2.jpeg" alt="Product 2">
                <h3>Product 2</h3>
                <p>$29.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
            <div class="product" data-id="3" data-name="Product 3" data-price="9.99">
                <img src="images/3.jpeg" alt="Product 3">
                <h3>Product 3</h3>
                <p>$9.99</p>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>

        <div class="cart-modal" id="cartModal">
            <div class="cart-content">
                <h2>Your Cart</h2>
                <ul id="cartItemsList"></ul>
                <p><strong>Total: $<span id="totalAmount">0.00</span></strong></p>
                <button class="close-cart" onclick="toggleCart()">Close Cart</button>
                <button class="clear-cart" onclick="clearCart()">Clear Cart</button>
            </div>
        </div>
    </main>

    <script src="cart.js"></script>
</body>
</html>
